<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>需要密码才能访问</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }
    #login-box, #content {
      background: white;
      padding: 2rem 3rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #login-box input {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 200px;
    }
    #login-box button {
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #error-msg {
      color: red;
      margin-top: 0.5rem;
    }
    #content {
      display: none; /* 默认隐藏 */
    }
  </style>
</head>
<body>

  <!-- 密码输入区域，初始显示 -->
  <div id="https://wendrose.github.io/shuadanci">
    <h2>请输入访问密码</h2>
    <input type="password" id="password-input" placeholder="输入密码">
    <br>
    <button onclick="checkPassword()">确认</button>
    <div id="error-msg"></div>
  </div>

  <!-- 受保护的真实内容，初始隐藏 -->
  <div id="content">
    <h1>🎉 欢迎！</h1>
    <p>这里是只有输入正确密码才能看到的内容。</p>
    <p>你可以替换成任何 HTML。</p>
  </div>

  <script>
    // ⚠️ 这里设置你的密码（明文，可见于源码）
    const CORRECT_PASSWORD = "sdc2026";

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      const errorMsg = document.getElementById("error-msg");

      if (input === CORRECT_PASSWORD) {
        // 密码正确：隐藏登录框，显示内容
        document.getElementById("login-box").style.display = "none";
        document.getElementById("content").style.display = "block";
      } else {
        errorMsg.textContent = "密码错误，请重试";
        // 清空输入框
        document.getElementById("password-input").value = "";
      }
    }

    // 允许按回车键提交
    document.getElementById("password-input")
      .addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
          checkPassword();
        }
      });
  </script>
</body>
</html>
